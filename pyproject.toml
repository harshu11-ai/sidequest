[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sidequest"
dynamic = ["version"]
description = "A local prompt companion for Claude Code and Codex CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Harshith Yallampalli" },
]
keywords = ["autocorrect", "chess", "terminal", "claude-code", "codex", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Terminals",
]
dependencies = [
  "chessnut>=0.4.1,<0.5",
  "symspellpy>=6.10,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.8",
  "twine>=5",
]

[project.scripts]
sidequest = "sidequest.cli:main"
# Backward-compatible alias for existing CLI Autocorrect users.
cauto = "sidequest.cli:main"

[project.urls]
Homepage = "https://github.com/harshu11-ai/sidequest"
Repository = "https://github.com/harshu11-ai/sidequest"
Issues = "https://github.com/harshu11-ai/sidequest/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "sidequest.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sidequest.chess" = ["web/*.css", "web/*.html", "web/*.js", "web/*.svg", "web/*.txt"]
"sidequest.video" = ["catalog.json", "web/*.css", "web/*.html", "web/*.js"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
