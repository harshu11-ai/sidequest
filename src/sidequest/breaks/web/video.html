<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#181a19">
    <title>Sidequest Videos</title>
    <link rel="stylesheet" href="/video/style.css">
    <link rel="stylesheet" href="/breaks/panel.css">
  </head>
  <body>
    <main>
      <header class="app-header">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 5 6 7-6 7M13 19h6" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>
          <h1>Sidequest</h1>
        </div>
        <div class="agent-status"><span class="status-dot status-dot--online" id="agent-dot"></span><span id="agent-status">Connecting</span></div>
      </header>

      <div class="mini-strip">
        <label class="mini-toggle" aria-label="Chess, off for your next prompt">
          <input type="checkbox" data-toggle="chess" hidden>
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3" y="3" width="6" height="6" fill="currentColor" opacity=".9"/><rect x="11" y="3" width="6" height="6" fill="currentColor" opacity=".35"/><rect x="3" y="11" width="6" height="6" fill="currentColor" opacity=".35"/><rect x="11" y="11" width="6" height="6" fill="currentColor" opacity=".9"/></svg>
          Chess
        </label>
        <label class="mini-toggle" aria-label="Video, on for your next prompt">
          <input type="checkbox" data-toggle="video" checked hidden>
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M8.5 7.5 13 10l-4.5 2.5v-5Z" fill="currentColor"/></svg>
          Video
        </label>
      </div>

      <section class="watch" aria-label="Video player">
        <div class="player-column">
          <div class="player-shell">
            <div id="yt-player"></div>
          </div>
          <div class="player-row">
            <span id="video-title" class="video-title">Loading…</span>
            <span id="video-channel" class="player-detail">—</span>
          </div>
          <div class="controls">
            <button id="prev" class="secondary" type="button"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6 4v12M16 5 8 10l8 5V5Z"/></svg> Previous video</button>
            <button id="next" class="secondary" type="button">Next video <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M14 4v12M4 5l8 5-8 5V5Z"/></svg></button>
          </div>
        </div>

        <aside class="side-column" aria-label="Up next">
          <div>
            <h2 class="section-title">Up next</h2>
          </div>
          <p id="last-turn-notice" class="last-turn-notice" aria-live="polite" hidden>Your agent finished. Your spot is saved.</p>
          <ol id="queue-list" class="queue-list" aria-label="Video queue"></ol>
          <div class="actions">
            <button id="return" type="button">Return to work <span aria-hidden="true">↗</span></button>
          </div>
        </aside>
      </section>
    </main>

    <div id="finished" class="finished" role="dialog" aria-modal="true" aria-labelledby="finished-title" hidden>
      <div>
        <h2 id="finished-title">Your agent is ready.</h2>
        <p>Your spot in the queue is saved. Pick up where you left off next time.</p>
        <button id="close-window" type="button">Return to terminal <span aria-hidden="true">↗</span></button>
      </div>
    </div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="/video/app.js"></script>
    <script src="/breaks/panel.js"></script>
  </body>
</html>
