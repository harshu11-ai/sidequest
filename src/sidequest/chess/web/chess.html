<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sidequest Chess</title>
    <link rel="stylesheet" href="/cm-chessboard.css">
    <link rel="stylesheet" href="/cm-markers.css">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">SIDEQUEST</p>
          <h1>Your agent is working</h1>
        </div>
      </header>

      <section class="game">
        <div id="board" class="board-shell" aria-label="Chess board"></div>
        <div class="side-column">
          <button id="new-game" class="secondary" type="button">New game</button>
          <aside aria-label="Game controls">
            <div class="turn-indicator"><span id="turn-dot"></span><span id="status">Loading…</span></div>
            <p id="last-turn-notice" class="last-turn-notice" aria-live="polite" hidden>
              Your agent finished — make your last move to close this window.
            </p>
            <p class="side-note" id="side-note">You play White</p>
            <div id="multiplayer-panel" class="multiplayer-panel" hidden>
              <dl>
                <dt>Room code</dt>
                <dd id="room-code">—</dd>
                <dt>Opponent</dt>
                <dd class="opponent-row">
                  <span id="opponent-dot" class="status-dot"></span>
                  <span id="opponent-status">—</span>
                </dd>
              </dl>
              <button id="toggle-practice" class="secondary" type="button">Play vs bot while you wait</button>
            </div>
            <dl id="practice-panel">
              <dt>Opponent</dt>
              <dd id="engine">Local engine</dd>
              <dt><label for="difficulty">Difficulty</label></dt>
              <dd>
                <select id="difficulty" aria-label="Opponent difficulty">
                  <option value="easy">Easy</option>
                  <option value="medium">Medium</option>
                  <option value="hard">Hard</option>
                </select>
              </dd>
            </dl>
            <p id="message" class="message" aria-live="polite"></p>
            <button id="return" type="button">Return to work</button>
          </aside>
        </div>
      </section>
    </main>

    <div id="finished" class="finished" hidden>
      <div>
        <p class="eyebrow">TURN COMPLETE</p>
        <h2>Your agent is ready.</h2>
        <p>This game is saved and will resume with your next prompt.</p>
        <button id="close-window" type="button">Return to terminal</button>
      </div>
    </div>
    <script src="/cm-chessboard.js"></script>
    <script src="/cm-markers.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
