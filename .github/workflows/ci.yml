name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v

  quality:
    name: Lint and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development tools
        run: python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/sidequest-wheel-test
          /tmp/sidequest-wheel-test/bin/pip install dist/*.whl
          /tmp/sidequest-wheel-test/bin/sidequest --version
          /tmp/sidequest-wheel-test/bin/sidequest --doctor
          /tmp/sidequest-wheel-test/bin/cauto --version
      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: sidequest-distributions
          path: dist/
          if-no-files-found: error

  relay:
    name: Test multiplayer relay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: relay/requirements-dev.txt
      - name: Install relay development dependencies
        run: python -m pip install -r relay/requirements-dev.txt
      - name: Run relay tests
        run: python -m pytest relay/tests -q
